name: Publish beta to npm

# 与 publish.yml 相同，但以 --tag beta 发布：
# beta 版本不会移动 latest dist-tag，npm install jsql-neo 的用户不受影响。
# 触发方式：推送 v*-beta* / *-beta* 的 tag（如 v6.0.0-beta2），或手动 workflow_dispatch。

on:
  push:
    tags:
      - 'v*-beta*'
  workflow_dispatch:

permissions:
  id-token: write   # npm provenance（OIDC，无需 NPM_TOKEN）
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: npm install

      - name: 冒烟测试
        run: npm test

      - name: 发布到 npm（beta dist-tag）
        run: npm publish --provenance --access public --tag beta
