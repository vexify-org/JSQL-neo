name: Build native .node binaries

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-native:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: lib
            ext: .so
            asset: jsql-neo-native.linux-x64-gnu.node
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            lib: lib
            ext: .so
            asset: jsql-neo-native.linux-arm64-gnu.node
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: lib
            ext: .dylib
            asset: jsql-neo-native.darwin-arm64.node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: ''
            ext: .dll
            asset: jsql-neo-native.win32-x64-msvc.node
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: jsql-neo-native.linux-x64-musl.node
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: jsql-neo-native.linux-arm64-musl.node
            musl: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Rust toolchain
        if: ${{ !matrix.musl }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        if: ${{ !matrix.musl }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nativesrc/jsql-neo-native -> target
          key: ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.musl }}
        shell: bash
        run: |
          set -euo pipefail
          cd nativesrc/jsql-neo-native
          cargo build --release --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}jsql_neo_native${{ matrix.ext }}" \
             "../../${{ matrix.asset }}"

      - name: Build (musl)
        if: ${{ matrix.musl }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w node:22-alpine sh -c '
            set -e
            apk add --no-cache build-base rust cargo
            cd nativesrc/jsql-neo-native
            cargo build --release
            cp target/release/libjsql_neo_native.so "/w/${{ matrix.asset }}"
          '

      - name: Smoke load test
        if: ${{ !matrix.musl }}
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('./${{ matrix.asset }}'); console.log('${{ matrix.asset }} load ok')"

      - name: Smoke load test (musl)
        if: ${{ matrix.musl }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w node:22-alpine \
            node -e "require('./${{ matrix.asset }}'); console.log('${{ matrix.asset }} load ok')"

      # 所有平台统一先传成 artifact（手动跑、分支跑也能在这里下产物）
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -lh artifacts/

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.node > SHA256SUMS
          cat SHA256SUMS

      # 一个 job 一次性上传，不会再有 race condition
      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.node
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
