name: Build native .node binaries

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-native:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: lib
            ext: .so
            asset: jsql-neo-native.linux-x64-gnu.node
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            lib: lib
            ext: .so
            asset: jsql-neo-native.linux-arm64-gnu.node
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: lib
            ext: .dylib
            asset: jsql-neo-native.darwin-arm64.node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: ''
            ext: .dll
            asset: jsql-neo-native.win32-x64-msvc.node

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nativesrc/jsql-neo-native -> target
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd nativesrc/jsql-neo-native
          cargo build --release --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}jsql_neo_native${{ matrix.ext }}" \
             "../../${{ matrix.asset }}"

      - name: Smoke load test
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('./${{ matrix.asset }}'); console.log('${{ matrix.asset }} load ok')"

      # 所有平台统一先传成 artifact（手动跑、分支跑也能在这里下产物）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -lh artifacts/

      # 一个 job 一次性上传，不会再有 race condition
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.node
          fail_on_unmatched_files: true
