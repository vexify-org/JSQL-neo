name: Test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      - name: 缓存 node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package.json') }}

      - name: 安装依赖
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

      # 供应链安全（issue #25）：postinstall 默认不再自动下载预编译二进制（opt-in）。
      # CI 需要原生模块来跑 native 测试，因此这里显式开启自动下载，拉取本平台模块。
      - name: 准备原生模块（按平台拉取）
        run: node postinstall.js
        env:
          JSQL_AUTO_DOWNLOAD_NATIVE: '1'

      - name: 跑测试
        run: npm test
