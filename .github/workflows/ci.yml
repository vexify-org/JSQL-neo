name: Test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      - name: 缓存 node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package.json') }}

      - name: 安装依赖
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

      # 仓库里提交的 native/jsql-neo-native.node 是平台相关的（且可能是别的平台构建的），
      # 不能跨平台使用。缓存命中时上面的 npm install 会被跳过、postinstall 不执行，
      # 于是测试会去加载那个不匹配的二进制而失败。这里无条件拉取本平台的原生模块。
      - name: 准备原生模块（按平台拉取）
        run: node postinstall.js

      - name: 跑测试
        run: npm test
