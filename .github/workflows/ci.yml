name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 缓存 node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node${{ matrix.node }}-node-modules-${{ hashFiles('**/package.json') }}

      - name: 安装依赖
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

      # 供应链安全（issue #25）：postinstall 默认不再自动下载预编译二进制（opt-in）。
      # CI 需要原生模块来跑 native 测试，因此这里显式开启自动下载，拉取本平台模块。
      # 缓存命中时上面的 npm install 会被跳过、postinstall 不执行，所以必须单独跑。
      - name: 准备原生模块（按平台拉取）
        env:
          JSQL_NATIVE_DOWNLOAD: '1'
          JSQL_AUTO_DOWNLOAD_NATIVE: '1'
          JSQL_GHPROXY: ${{ secrets.JSQL_GHPROXY }}
        run: node postinstall.js

      - name: 跑测试
        env:
          JSQL_NATIVE_DOWNLOAD: '1'
          JSQL_AUTO_DOWNLOAD_NATIVE: '1'
          JSQL_GHPROXY: ${{ secrets.JSQL_GHPROXY }}
        run: npm test
