name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - beta

permissions:
  id-token: write   # OIDC 必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24          # 建议 24，自带 npm >= 11.5.1
          # 绝对不要加 registry-url

      - name: 升级 npm（Node 24 可省略）
        run: npm install -g npm@latest

      - name: 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package.json') }}

      - name: 安装依赖
        run: npm install

      - name: 冒烟测试
        run: npm test

      - name: 判断 dist-tag
        id: dist
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == *beta* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 发布到 npm
        run: npm publish --access public --tag ${{ steps.dist.outputs.tag }}
        # 不要传 NODE_AUTH_TOKEN，OIDC 会自动处理
