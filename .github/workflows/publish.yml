name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - beta
          - fix

permissions:
  id-token: write   # npm provenance（OIDC，无需 NPM_TOKEN）
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 缓存 node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package.json') }}

      - name: 安装依赖
        run: npm install

      - name: 冒烟测试
        run: npm test

      # 预发布 tag 约定：vX.Y.Z-fix.xxx（major.minor.patch-fix.xxx）
      - name: 校验 tag 与 package.json 版本
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 只允许 vX.Y.Z 或预发布 vX.Y.Z-fix.xxx；别的形状直接拒绝，避免把野 tag 发上 npm。
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|fix)\.[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::非法 tag: $TAG（应为 vX.Y.Z 或 vX.Y.Z-fix.xxx）"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG 与 package.json 版本 v$VERSION 不一致"
            exit 1
          fi

      - name: 判断 dist-tag
        id: dist
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == *-fix.* ]]; then
            # vX.Y.Z-fix.xxx 是预发布：发到 fix dist-tag，绝不覆盖 latest
            echo "tag=fix" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == *beta* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 发版元数据门禁
        # 阻止「bump 了版本却漏写 CHANGELOG 章节」的包被发出去（6.6.0/6.6.1、
        # 6.6.3/6.6.4 都发生过）。纯本地静态检查，不联网。
        run: npm run check:release

      - name: 发布到 npm
        run: npm publish --provenance --access public --tag ${{ steps.dist.outputs.tag }}
