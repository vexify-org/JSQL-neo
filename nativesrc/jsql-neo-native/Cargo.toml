[package]
name = "jsql-neo-native"
version = "5.6.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jsql-neo-core = { path = "../jsql-neo-core" }
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"

# 体积更小 + 运行更快：全图 LTO 去掉跨 crate 死代码，单 codegen-unit 换取更好的内联与优化，
# strip 去掉符号表（不影响 napi 动态导出符号与 dlopen 加载）。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
