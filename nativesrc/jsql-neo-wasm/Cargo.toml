[package]
name = "jsql-neo-wasm"
version = "6.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jsql-neo-core = { path = "../jsql-neo-core", features = ["wasm"] }
wasm-bindgen = "0.2"
serde_json = "1"

[dependencies.js-sys]
version = "0.3"

# wasm 产物：LTO + 单 codegen-unit 显著减小体积，strip 去掉符号表
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
